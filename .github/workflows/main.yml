name: Build Creative Squad 4

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Permissão do gradlew
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Enviar o mod (.jar)
        uses: actions/upload-artifact@v4
        with:
          name: cs4-mod
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
